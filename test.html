<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>INFINITY SPACE - page de test</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 600px; margin: 20px auto; padding: 0 12px; }
    progress { width: 100%; height: 16px; }
    progress.low { accent-color: red; }
    button { margin: 4px 4px 4px 0; padding: 8px 12px; }
    #event-box { background: #eef; padding: 8px; margin: 10px 0; }
  </style>
</head>
<body>
  <!-- Page de TEST du coordinateur. Le membre 2 peut copier les identifiants (id) -->

  <div id="start-screen">
    <h1>INFINITY SPACE</h1>
    <p>Dirige un avant-poste lunaire pendant 10 jours.</p>
    <button id="start-button">Start Mission</button>
  </div>

  <div id="game-screen" style="display:none">
    <h2><span id="day-display"></span> - <span id="crew-display"></span></h2>

    <p>Eau : <span id="value-water"></span><br><progress id="gauge-water" max="100" value="100"></progress></p>
    <p>Oxygène : <span id="value-oxygen"></span><br><progress id="gauge-oxygen" max="100" value="100"></progress></p>
    <p>Énergie : <span id="value-energy"></span><br><progress id="gauge-energy" max="100" value="100"></progress></p>
    <p>Nourriture : <span id="value-food"></span><br><progress id="gauge-food" max="100" value="100"></progress></p>
    <p>Protection : <span id="value-shielding"></span><br><progress id="gauge-shielding" max="100" value="100"></progress></p>

    <div>
      <button data-action="saveEnergy">Économiser l'énergie</button>
      <button data-action="repair">Réparer</button>
      <button data-action="useReserve">Utiliser la réserve</button>
      <button data-action="reinforceShield">Renforcer la protection</button>
      <button data-action="none">Ne rien faire</button>
    </div>

    <div id="event-box"></div>
    <ul id="log-list"></ul>
  </div>

  <div id="end-screen" style="display:none">
    <div id="report"></div>
    <button id="restart-button">Rejouer</button>
  </div>

  <!-- Ordre important : les données et calculs d'abord, main.js en dernier -->
  <script src="js/mission-data.js"></script>
  <script src="js/simulation.js"></script>
  <script src="js/events.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
